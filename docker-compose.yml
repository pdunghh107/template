x-spring-env: &spring-env
  SPRING_PROFILES_ACTIVE: postgres
  SPRING_DATASOURCE_URL: "jdbc:postgresql://pgbouncer:6432/${POSTGRES_DB:-template}?prepareThreshold=0&preparedStatementCacheQueries=0&preparedStatementCacheSizeMiB=0"
  SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-template}"
  SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-template}"
  SPRING_FLYWAY_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-template}"
  SPRING_FLYWAY_USER: "${POSTGRES_USER:-template}"
  SPRING_FLYWAY_PASSWORD: "${POSTGRES_PASSWORD:-template}"
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "4"
  SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "1"
  SPRING_DATASOURCE_HIKARI_IDLETIMEOUT: "600000"
  SPRING_DATASOURCE_HIKARI_MAXLIFETIME: "1800000"
  SPRING_DATASOURCE_HIKARI_CONNECTIONTIMEOUT: "30000"

x-spring-service: &spring-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    pgbouncer:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: template-postgres
    restart: unless-stopped
    command: postgres -c max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-template}"
      POSTGRES_USER: "${POSTGRES_USER:-template}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-template}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - template-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-template} -d ${POSTGRES_DB:-template}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: template-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-template}"
      POSTGRES_USER: "${POSTGRES_USER:-template}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-template}"
      PGBOUNCER_PORT: "6432"
      PGBOUNCER_POOL_MODE: "${PGBOUNCER_POOL_MODE:-transaction}"
      PGBOUNCER_MAX_CLIENT_CONN: "${PGBOUNCER_MAX_CLIENT_CONN:-300}"
      PGBOUNCER_DEFAULT_POOL_SIZE: "${PGBOUNCER_DEFAULT_POOL_SIZE:-32}"
      PGBOUNCER_MIN_POOL_SIZE: "${PGBOUNCER_MIN_POOL_SIZE:-8}"
      PGBOUNCER_RESERVE_POOL_SIZE: "${PGBOUNCER_RESERVE_POOL_SIZE:-8}"
      PGBOUNCER_MAX_DB_CONNECTIONS: "${PGBOUNCER_MAX_DB_CONNECTIONS:-48}"
      PGBOUNCER_SERVER_IDLE_TIMEOUT: "${PGBOUNCER_SERVER_IDLE_TIMEOUT:-30}"
    entrypoint:
      - /bin/sh
      - /usr/local/bin/pgbouncer-entrypoint.sh
    volumes:
      - ./infra/pgbouncer/entrypoint.sh:/usr/local/bin/pgbouncer-entrypoint.sh:ro
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -p 6432 -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1;' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: template-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: template-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-template}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-template}"
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: template-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio123}"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - template-minio:/data
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: template-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - template-elasticsearch:/usr/share/elasticsearch/data

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: template-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-template}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-template}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.27.2
    container_name: template-temporal-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal

  auth:
    <<: *spring-service
    container_name: template-auth
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      <<: *spring-env
      APP_AUTH_JWT_SECRET: "${JWT_SECRET:-12345678901234567890123456789012}"
      APP_AUTH_ACCESS_TOKEN_MINUTES: "${JWT_ACCESS_TOKEN_MINUTES:-15}"
      APP_AUTH_REFRESH_TOKEN_DAYS: "${JWT_REFRESH_TOKEN_DAYS:-7}"
      APP_AUTH_EXPOSE_DEV_SECRETS: "false"
      SEED_USER_EMAIL: "${SEED_USER_EMAIL:-superadmin@template.local}"
      SEED_USER_PASSWORD: "${SEED_USER_PASSWORD:-ChangeMe123!}"
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:-dev-internal-key}"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "${RABBITMQ_PORT:-5672}"
      RABBITMQ_USER: "${RABBITMQ_USER:-template}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-template}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8081:8081"

volumes:
  template-postgres:
  template-minio:
  template-elasticsearch:
