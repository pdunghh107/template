server:
  port: 9091

spring:
  application:
    name: auth-service

  # Base config, lấy dữ liệu từ Biến môi trường (Environment Variables) do Server/Docker truyền vào
  # Cú pháp ${TÊN_BIẾN:giá_trị_mặc_định}
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:template_dev}?currentSchema=auth&prepareThreshold=0&preparedStatementCacheQueries=0&preparedStatementCacheSizeMiB=0
    username: ${POSTGRES_USER:template_dev}
    password: ${POSTGRES_PASSWORD:template_dev_pass}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:4}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:template_dev}?currentSchema=auth
    user: ${POSTGRES_USER:template_dev}
    password: ${POSTGRES_PASSWORD:template_dev_pass}
    schemas: auth
    create-schemas: true
    baseline-on-migrate: true

  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:template_dev}
    password: ${RABBITMQ_PASSWORD:template_dev_mq}

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

app:
  auth:
    jwt:
      secret: ${APP_AUTH_JWT_SECRET:dev_12345678901234567890123456789012}
      access-token-minutes: ${APP_AUTH_JWT_ACCESS_TOKEN_MINUTES:15}
      refresh-token-days: ${APP_AUTH_JWT_REFRESH_TOKEN_DAYS:7}
    expose-dev-secrets: ${APP_AUTH_EXPOSE_DEV_SECRETS:false}

  internal:
    service-key: ${APP_INTERNAL_SERVICE_KEY:dev-internal-key}
